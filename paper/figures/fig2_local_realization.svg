<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Local Gyro realization and context update</title>
  <desc id="desc">Structure is conditioned by Orientation and Context. Slice yields a local articulation, which becomes a Stability Scene. Incorporated Readability updates the later readability context and contributes to later Structure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>
  <text x="700" y="48" text-anchor="middle" font-family="sans-serif" font-size="32">Local Gyro realization</text>
  <rect x="60" y="210" width="210" height="100" rx="16" fill="white" stroke="#222" stroke-width="3"/>
  <rect x="350" y="210" width="210" height="100" rx="16" fill="white" stroke="#222" stroke-width="3"/>
  <rect x="640" y="210" width="220" height="100" rx="16" fill="white" stroke="#222" stroke-width="3"/>
  <rect x="950" y="175" width="360" height="170" rx="16" fill="white" stroke="#222" stroke-width="3"/>
  <text x="165" y="270" text-anchor="middle" font-family="sans-serif" font-size="28">Structure Sₙ</text>
  <text x="455" y="270" text-anchor="middle" font-family="sans-serif" font-size="28">Slice Σₙ</text>
  <text x="750" y="260" text-anchor="middle" font-family="sans-serif" font-size="27">local articulation</text>
  <text x="750" y="294" text-anchor="middle" font-family="sans-serif" font-size="28">aₙ</text>
  <text x="1130" y="220" text-anchor="middle" font-family="sans-serif" font-size="27">Stability Scene Kₙ</text>
  <text x="1130" y="265" text-anchor="middle" font-family="serif" font-size="25">(aₙ, Lₙ, Uₙ, Cₙ⁺)</text>
  <text x="1130" y="310" text-anchor="middle" font-family="sans-serif" font-size="21">readable + continuable + residual not-yet</text>
  <line x1="270" y1="260" x2="350" y2="260" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="560" y1="260" x2="640" y2="260" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="860" y1="260" x2="950" y2="260" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="350" y="78" width="210" height="76" rx="14" fill="white" stroke="#555" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="455" y="125" text-anchor="middle" font-family="sans-serif" font-size="23">Orientation Bₙ</text>
  <rect x="640" y="78" width="210" height="76" rx="14" fill="white" stroke="#555" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="745" y="125" text-anchor="middle" font-family="sans-serif" font-size="23">Context cₙ</text>
  <line x1="455" y1="154" x2="455" y2="208" stroke="#555" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <line x1="745" y1="154" x2="505" y2="208" stroke="#555" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <rect x="950" y="430" width="360" height="100" rx="16" fill="white" stroke="#222" stroke-width="3"/>
  <text x="1130" y="472" text-anchor="middle" font-family="sans-serif" font-size="24">qₙ = Inc(gₙ)</text>
  <text x="1130" y="507" text-anchor="middle" font-family="sans-serif" font-size="21">incorporated readability</text>
  <line x1="1130" y1="345" x2="1130" y2="430" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="420" y="430" width="400" height="100" rx="16" fill="white" stroke="#222" stroke-width="3"/>
  <text x="620" y="472" text-anchor="middle" font-family="sans-serif" font-size="23">Γₙ₊₁ = UpdateΓ(Γₙ, qₙ, eₙ)</text>
  <text x="620" y="507" text-anchor="middle" font-family="sans-serif" font-size="21">later readability context</text>
  <line x1="950" y1="480" x2="820" y2="480" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="420" y1="480" x2="270" y2="480" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="160" y="470" text-anchor="middle" font-family="sans-serif" font-size="22">contributes to</text>
  <text x="160" y="504" text-anchor="middle" font-family="sans-serif" font-size="24">later Sₙ₊₁</text>
</svg>
