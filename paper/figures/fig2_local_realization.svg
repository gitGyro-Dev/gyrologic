<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Local Gyro realization and context update</title>
  <desc id="desc">Structure is conditioned by Orientation and Context. Slice yields a local articulation, which becomes a Stability Scene. Incorporated Readability updates the later readability context and contributes to later Structure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>
  <text x="700" y="48" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="32">Local Gyro realization</text>

  <rect x="60" y="220" width="210" height="100" rx="16" fill="white" stroke="#222" stroke-width="3"/>
  <rect x="350" y="220" width="210" height="100" rx="16" fill="white" stroke="#222" stroke-width="3"/>
  <rect x="640" y="220" width="220" height="100" rx="16" fill="white" stroke="#222" stroke-width="3"/>
  <rect x="940" y="175" width="380" height="195" rx="16" fill="white" stroke="#222" stroke-width="3"/>

  <text x="165" y="280" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="28">Structure Sₙ</text>
  <text x="455" y="280" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="28">Slice Σₙ</text>
  <text x="750" y="265" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="27">local articulation</text>
  <text x="750" y="301" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="28">aₙ</text>

  <text x="1130" y="222" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="27">Stability Scene Kₙ</text>
  <text x="1130" y="270" text-anchor="middle" font-family="Noto Serif CJK JP" font-size="26">(aₙ, Lₙ, Uₙ, Cₙ⁺)</text>
  <text x="1130" y="316" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">readable + continuable</text>
  <text x="1130" y="347" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">+ residual not-yet</text>

  <line x1="270" y1="270" x2="350" y2="270" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="560" y1="270" x2="640" y2="270" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="860" y1="270" x2="940" y2="270" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="350" y="82" width="210" height="76" rx="14" fill="white" stroke="#555" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="455" y="130" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">Orientation Bₙ</text>
  <rect x="640" y="82" width="210" height="76" rx="14" fill="white" stroke="#555" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="745" y="130" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">Context cₙ</text>
  <line x1="455" y1="158" x2="455" y2="218" stroke="#555" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <line x1="745" y1="158" x2="505" y2="218" stroke="#555" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <rect x="940" y="455" width="380" height="105" rx="16" fill="white" stroke="#222" stroke-width="3"/>
  <text x="1130" y="498" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">qₙ = Inc(gₙ)</text>
  <text x="1130" y="535" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">incorporated readability</text>
  <line x1="1130" y1="370" x2="1130" y2="455" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="405" y="455" width="430" height="105" rx="16" fill="white" stroke="#222" stroke-width="3"/>
  <text x="620" y="498" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">Γₙ₊₁ = UpdateΓ(Γₙ, qₙ, eₙ)</text>
  <text x="620" y="535" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">later readability context</text>
  <line x1="940" y1="507" x2="835" y2="507" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="405" y1="507" x2="275" y2="507" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="160" y="492" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">contributes to</text>
  <text x="160" y="528" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">later Sₙ₊₁</text>
</svg>