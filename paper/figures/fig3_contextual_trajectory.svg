<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Contextual tracing from a relation-bearing field to a readable Trajectory</title>
  <desc id="desc">A relation-bearing field contains local Gyro realizations and heterogeneous relations. Contextual tracing under Orientation, Context, Slice, and readability context yields a readable Trajectory that may branch, merge, and cross gaps.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <text x="700" y="46" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="32">Contextual Trajectory</text>

  <rect x="45" y="90" width="650" height="545" rx="20" fill="white" stroke="#222" stroke-width="3"/>
  <text x="370" y="138" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="27">relation-bearing trace field 𝒢ᵣ = (G, E)</text>

  <circle cx="150" cy="255" r="45" fill="white" stroke="#222" stroke-width="3"/>
  <text x="150" y="265" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">g₁</text>
  <circle cx="345" cy="210" r="45" fill="white" stroke="#222" stroke-width="3"/>
  <text x="345" y="220" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">g₂</text>
  <circle cx="345" cy="400" r="45" fill="white" stroke="#222" stroke-width="3"/>
  <text x="345" y="410" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">g₃</text>
  <circle cx="555" cy="305" r="45" fill="white" stroke="#222" stroke-width="3"/>
  <text x="555" y="315" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">g₄</text>
  <circle cx="180" cy="515" r="45" fill="white" stroke="#888" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="180" y="525" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">g₅</text>

  <line x1="195" y1="245" x2="300" y2="220" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="193" y1="279" x2="305" y2="375" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="390" y1="225" x2="515" y2="287" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="390" y1="390" x2="515" y2="323" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="225" y1="507" x2="510" y2="330" stroke="#888" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>

  <text x="370" y="584" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">candidate relations may be heterogeneous,</text>
  <text x="370" y="617" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">dormant, conflicting, or unreadable</text>

  <rect x="760" y="150" width="570" height="155" rx="18" fill="white" stroke="#222" stroke-width="3"/>
  <text x="1045" y="197" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="27">Trace under B, c, Σₜ, Γₜ</text>
  <text x="1045" y="242" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">admit · suppress · weight</text>
  <text x="1045" y="278" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">compose · reinterpret</text>
  <line x1="695" y1="275" x2="760" y2="225" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="760" y="365" width="570" height="255" rx="18" fill="white" stroke="#222" stroke-width="3"/>
  <text x="1045" y="410" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="27">readable Trajectory T</text>

  <circle cx="855" cy="500" r="32" fill="white" stroke="#222" stroke-width="3"/>
  <text x="855" y="509" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">g₁</text>
  <circle cx="1015" cy="460" r="32" fill="white" stroke="#222" stroke-width="3"/>
  <text x="1015" y="469" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">g₂</text>
  <circle cx="1015" cy="545" r="32" fill="white" stroke="#222" stroke-width="3"/>
  <text x="1015" y="554" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">g₃</text>
  <circle cx="1195" cy="500" r="32" fill="white" stroke="#222" stroke-width="3"/>
  <text x="1195" y="509" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">g₄</text>

  <line x1="887" y1="492" x2="983" y2="468" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="887" y1="508" x2="983" y2="537" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1047" y1="468" x2="1163" y2="492" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1047" y1="537" x2="1163" y2="508" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="1045" y="598" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">branching and merging</text>
  <text x="1045" y="628" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">remain readable</text>
  <line x1="1045" y1="305" x2="1045" y2="365" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="700" y="710" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">relation-bearing field ≠ Trajectory</text>
  <text x="700" y="744" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="26">record gap ≠ Trajectory break</text>
</svg>