<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Contextual tracing from a relation-bearing field to a readable Trajectory</title>
  <desc id="desc">A relation-bearing field contains local Gyro realizations and heterogeneous relations. Contextual tracing under Orientation, Context, Slice, and readability context yields a readable Trajectory that may branch, merge, and cross gaps.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>
  <text x="700" y="45" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="32">Contextual Trajectory</text>
  <rect x="45" y="90" width="650" height="520" rx="20" fill="white" stroke="#222" stroke-width="3"/>
  <text x="370" y="135" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="27">relation-bearing trace field 𝒢ᵣ = (G, E)</text>
  <circle cx="150" cy="250" r="45" fill="white" stroke="#222" stroke-width="3"/><text x="150" y="260" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="24">g₁</text>
  <circle cx="345" cy="205" r="45" fill="white" stroke="#222" stroke-width="3"/><text x="345" y="215" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="24">g₂</text>
  <circle cx="345" cy="390" r="45" fill="white" stroke="#222" stroke-width="3"/><text x="345" y="400" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="24">g₃</text>
  <circle cx="555" cy="300" r="45" fill="white" stroke="#222" stroke-width="3"/><text x="555" y="310" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="24">g₄</text>
  <circle cx="180" cy="500" r="45" fill="white" stroke="#888" stroke-width="3" stroke-dasharray="8 7"/><text x="180" y="510" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="24">g₅</text>
  <line x1="195" y1="240" x2="300" y2="215" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="193" y1="274" x2="305" y2="365" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="390" y1="220" x2="515" y2="282" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="390" y1="380" x2="515" y2="318" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="225" y1="492" x2="510" y2="325" stroke="#888" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="370" y="570" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="21">candidate relations may be heterogeneous, dormant, conflicting, or unreadable</text>
  <rect x="760" y="155" width="570" height="120" rx="18" fill="white" stroke="#222" stroke-width="3"/>
  <text x="1045" y="200" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="25">Trace under B, c, Σₜ, Γₜ</text>
  <text x="1045" y="240" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="21">admit · suppress · weight · compose · reinterpret</text>
  <line x1="695" y1="260" x2="760" y2="215" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="760" y="340" width="570" height="230" rx="18" fill="white" stroke="#222" stroke-width="3"/>
  <text x="1045" y="385" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="27">readable Trajectory T</text>
  <circle cx="855" cy="470" r="32" fill="white" stroke="#222" stroke-width="3"/><text x="855" y="478" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="20">g₁</text>
  <circle cx="1015" cy="430" r="32" fill="white" stroke="#222" stroke-width="3"/><text x="1015" y="438" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="20">g₂</text>
  <circle cx="1015" cy="515" r="32" fill="white" stroke="#222" stroke-width="3"/><text x="1015" y="523" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="20">g₃</text>
  <circle cx="1195" cy="470" r="32" fill="white" stroke="#222" stroke-width="3"/><text x="1195" y="478" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="20">g₄</text>
  <line x1="887" y1="462" x2="983" y2="438" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="887" y1="478" x2="983" y2="507" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1047" y1="438" x2="1163" y2="462" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1047" y1="507" x2="1163" y2="478" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1045" y="550" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="20">branching and merging remain readable</text>
  <line x1="1045" y1="275" x2="1045" y2="340" stroke="#222" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="700" y="665" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="23">relation-bearing field ≠ Trajectory · record gap ≠ Trajectory break</text>
</svg>
