name: Assemble Minimal Formal Model Paper

# This workflow assembles the bilingual submission candidate, renders PDFs with
# Pandoc citeproc and LuaLaTeX, validates the outputs, and commits generated files.
on:
  workflow_dispatch:
  push:
    paths:
      - "paper/minimal_formal_model_en.md"
      - "paper/minimal_formal_model_jp.md"
      - "paper/references.bib"
      - "paper/sections/**"
      - "paper/figures/**"
      - "tools/assemble_minimal_formal_model_paper_v2.py"
      - "tools/build_minimal_formal_model_pdfs.sh"
      - "tools/check_minimal_formal_model_pdf_figures.py"
      - ".github/workflows/assemble_minimal_formal_model.yml"
  issues:
    types: [opened, edited, reopened]

# Only one paper-generation run may update main at a time. Queued runs wait
# instead of cancelling an in-progress PDF build.
concurrency:
  group: minimal-formal-model-paper-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  assemble:
    if: >-
      github.event_name != 'issues' ||
      github.event.issue.title == '[automation] Assemble Minimal Formal Model Paper'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Pandoc and PDF dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-luatex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-japanese \
            fonts-texgyre \
            fonts-noto-cjk \
            fonts-dejavu-core \
            librsvg2-bin \
            poppler-utils
          sudo fc-cache -f -v >/dev/null
          pandoc --version
          lualatex --version | head -n 2

      - name: Verify PDF fonts
        run: |
          fc-match "TeX Gyre Pagella"
          fc-match "TeX Gyre Heros"
          fc-match "DejaVu Sans Mono"
          fc-match "Noto Serif CJK JP"
          fc-match "Noto Sans CJK JP"
          fc-match "Latin Modern Math"

      - name: Assemble and review submission candidates
        run: python tools/assemble_minimal_formal_model_paper_v2.py

      - name: Generate and validate PDFs
        run: bash tools/build_minimal_formal_model_pdfs.sh

      - name: Commit generated manuscripts, PDFs, and figure review
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          GENERATED_FILES=(
            paper/minimal_formal_model_full_en.md
            paper/minimal_formal_model_full_jp.md
            paper/minimal_formal_model_consistency_review.md
            paper/pdf/minimal_formal_model_full_en.pdf
            paper/pdf/minimal_formal_model_full_jp.pdf
            paper/pdf/minimal_formal_model_figure_review.md
          )

          git add -f "${GENERATED_FILES[@]}"

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "Assemble, render, and review Minimal Formal Model paper PDFs"

          # Another event may have advanced main while this job was rendering.
          # Rebase the generated commit and retry the push. For conflicts limited
          # to generated artifacts, retain this run's freshly validated outputs.
          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              conflicted="$(git diff --name-only --diff-filter=U)"
              if [[ -z "${conflicted}" ]]; then
                echo "Rebase failed without identifiable conflicts."
                git rebase --abort || true
                exit 1
              fi

              while IFS= read -r file; do
                [[ -z "${file}" ]] && continue
                allowed=false
                for generated in "${GENERATED_FILES[@]}"; do
                  if [[ "${file}" == "${generated}" ]]; then
                    allowed=true
                    break
                  fi
                done
                if [[ "${allowed}" != true ]]; then
                  echo "Unexpected rebase conflict: ${file}"
                  git rebase --abort || true
                  exit 1
                fi
                git checkout --theirs -- "${file}"
                git add -f "${file}"
              done <<< "${conflicted}"

              GIT_EDITOR=true git rebase --continue
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed because main advanced; retrying."
            sleep $((attempt * 2))
          done

          echo "Unable to push generated artifacts after three attempts."
          exit 1
