name: Assemble Minimal Formal Model Paper

# This workflow assembles the bilingual manuscript and commits generated outputs.
on:
  workflow_dispatch:
  push:
    paths:
      - "paper/minimal_formal_model_en.md"
      - "paper/minimal_formal_model_jp.md"
      - "paper/sections/**"
      - "tools/assemble_minimal_formal_model_paper.py"
      - ".github/workflows/assemble_minimal_formal_model.yml"
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: read

jobs:
  assemble:
    if: >-
      github.event_name != 'issues' ||
      github.event.issue.title == '[automation] Assemble Minimal Formal Model Paper'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Assemble and review manuscripts
        run: python tools/assemble_minimal_formal_model_paper.py

      - name: Commit generated manuscripts
        run: |
          if git diff --quiet -- \
            paper/minimal_formal_model_full_en.md \
            paper/minimal_formal_model_full_jp.md \
            paper/minimal_formal_model_consistency_review.md; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            paper/minimal_formal_model_full_en.md \
            paper/minimal_formal_model_full_jp.md \
            paper/minimal_formal_model_consistency_review.md
          git commit -m "Assemble and review Minimal Formal Model paper"
          git push
