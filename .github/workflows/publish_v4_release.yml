name: Publish Gyro Logic v4.0 Release

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: read

concurrency:
  group: gyro-logic-v4-release-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == '[release-publish] Gyro Logic v4.0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Validate and publish v4.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release view v4.0 >/dev/null
          gh release edit v4.0 --draft=false

          echo "Gyro Logic v4.0 release published."
